<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFT BINGO</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>FFT BINGO</h1>
      <p class="display-date" id="display-date"></p>
    </header>

    <div class="app-stack">
    <section class="controls">
      <div class="control-row">
        <fieldset class="hosts-fieldset">
          <legend>Hosts</legend>
          <div class="checkbox-group hosts-grid" id="hosts-group">
            <label><input type="checkbox" name="host" value="Adam" checked> Adam</label>
            <label><input type="checkbox" name="host" value="Dave" checked> Dave</label>
            <label><input type="checkbox" name="host" value="Jamey" checked> Jamey</label>
            <label><input type="checkbox" name="host" value="Heath" checked> Heath</label>
            <label><input type="checkbox" name="host" value="Dan"> Dan</label>
            <label><input type="checkbox" name="host" value="Jacob"> Jacob</label>
          </div>
        </fieldset>

        <fieldset class="misc-fieldset">
          <legend>Miscellaneous</legend>
          <div class="checkbox-group misc-stack" id="misc-group">
            <label><input type="checkbox" name="misc" value="mailbag"> Mailbag</label>
            <label><input type="checkbox" name="misc" value="draft"> Mock Draft</label>
          </div>
        </fieldset>
      </div>

      <button type="button" id="generate-btn" class="primary-btn">Generate Grid</button>
      <p id="status-msg" class="status-msg" aria-live="polite"></p>
    </section>

    <section class="game" id="game-section" hidden>
      <div class="grid-column">
        <div class="bingo-grid" id="bingo-grid" role="grid" aria-label="Bingo grid"></div>

        <button type="button" id="confirm-btn" class="confirm-btn" hidden>CONFIRM BINGO!?</button>

        <div id="victory-section" class="share-block">
          <div id="victory-list"></div>
        </div>

        <button type="button" id="instant-win-cell" class="instant-win-cell" aria-pressed="false">
          <span class="instant-win-legend">Instant Win</span>
        </button>

        <div id="instant-win-section" class="share-block">
          <p id="instant-win-message" class="share-message"></p>
          <button type="button" id="instant-win-copy-btn" class="secondary-btn copy-btn">⧉ Copy victory text to share in YouTube chat.</button>
          <span id="instant-win-copy-feedback" class="copy-feedback" aria-live="polite"></span>
        </div>
      </div>
    </section>

    <section class="suggest-section">
      <label class="suggest-label" for="suggest-input">Suggest a bingo item:</label>
      <div class="suggest-row">
        <input type="text" id="suggest-input" class="suggest-input" maxlength="500" autocomplete="off" placeholder="Your idea…">
        <button type="button" id="suggest-submit" class="suggest-submit">Submit</button>
      </div>
      <p id="suggest-feedback" class="suggest-feedback" aria-live="polite"></p>
    </section>
    </div>
  </main>

  <iframe id="google-form-target" name="google-form-target" title="Suggestion submission" hidden></iframe>

  <script type="module" src="js/app.js"></script>
</body>
</html>
